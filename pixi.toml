[workspace]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "NexusAI"
platforms = ["linux-64"]
version = "0.1.0"

[system-requirements]
cuda = "12.0"

[tasks]
agent = "python nexus/agent/nexus_cli.py"
mojo-bitnet = "mojo run nexus/core/bitnet.mojo"
mojo-titans = "mojo run nexus/core/titans.mojo"
mojo-model = "mojo run nexus/core/nexus_model.mojo"
train-tok = "python nexus/tokenizer/japanese_bpe.py"
fetch-wiki = "python nexus/data/fetch_wiki_ja.py"
curate-data = "python nexus/data/curate_datasets.py"
pretrain = "python -u nexus/training/pretrain.py"
train = "python -u nexus/training/train.py"
run-mojo = "mojo run nexus/engine/runner.mojo"
test = "pytest tests/ -v"
bench = "python benchmarks/benchmark.py"

[dependencies]
mojo = ">=1.0.0,<2"
sentencepiece = ">=0.2.1,<0.3"
numpy = ">=2.5.3,<3"
requests = ">=2.34.2,<3"
beautifulsoup4 = ">=4.15.0,<5"
huggingface_hub = ">=1.30.0,<2"
tqdm = ">=4.70.0,<5"
pytorch = { version = ">=2.13.0,<3", build = "*cuda*" }
pytest = ">=9.1.1,<10"
pyarrow = ">=25.0.0,<26"
python = "3.12.*"
cuda-version = "12.9.*"
